{
  "openapi": "3.1.0",
  "info": {
    "title": "UberHub Auth API",
    "version": "0.0.1",
    "description": "Contrato da camada HTTP. Requer adaptadores externos e configuração de segurança da equipe. Nenhum endpoint recebe senha. Campos de identidade/permissão externos ao contrato não são usados."
  },
  "paths": {
    "/auth/register": {
      "post": {
        "operationId": "register",
        "description": "Cria somente a conta local a partir de uma identidade Firebase verificada (Google ou e-mail/senha). Não atribui permissões nem emite tokens.",
        "security": [],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/RegisterRequest"
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Operação concluída.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/RegisterResponse"
                }
              }
            }
          },
          "400": {
            "description": "VALIDATION_ERROR ou MALFORMED_REQUEST",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "401": {
            "description": "INVALID_FIREBASE_TOKEN",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "409": {
            "description": "ACCOUNT_ALREADY_EXISTS",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "503": {
            "description": "DEPENDENCY_UNAVAILABLE",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "500": {
            "description": "INTERNAL_ERROR",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          }
        }
      }
    }
  },
  "components": {
    "schemas": {
      "RegisterRequest": {
        "type": "object",
        "properties": {
          "idToken": {
            "type": "string",
            "minLength": 1,
            "writeOnly": true
          }
        },
        "required": [
          "idToken"
        ]
      },
      "RegisterResponse": {
        "type": "object",
        "properties": {
          "userId": {
            "type": "string"
          }
        },
        "required": [
          "userId"
        ]
      },
      "Problem": {
        "type": "object",
        "properties": {
          "type": {
            "type": "string",
            "example": "about:blank"
          },
          "title": {
            "type": "string"
          },
          "status": {
            "type": "integer"
          },
          "detail": {
            "type": "string"
          },
          "instance": {
            "type": "string"
          },
          "code": {
            "type": "string",
            "enum": [
              "VALIDATION_ERROR",
              "MALFORMED_REQUEST",
              "INVALID_FIREBASE_TOKEN",
              "INVALID_REFRESH_TOKEN",
              "ACCOUNT_INACTIVE",
              "ACCOUNT_ALREADY_EXISTS",
              "REGISTRATION_REQUIRED",
              "DEPENDENCY_UNAVAILABLE",
              "INTERNAL_ERROR"
            ]
          },
          "fieldErrors": {
            "type": "array",
            "items": {
              "type": "object",
              "properties": {
                "field": {
                  "type": "string"
                },
                "message": {
                  "type": "string"
                }
              },
              "required": [
                "field",
                "message"
              ]
            }
          }
        },
        "required": [
          "type",
          "title",
          "status",
          "detail",
          "instance",
          "code"
        ]
      }
    }
  }
}
